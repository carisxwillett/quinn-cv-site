<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quinn Willett, Senior Systems Administrator. Scroll to drive through LA.">
<title>Quinn's LA Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Overpass:wght@600;800&display=swap">
<style>
/* Layout: full-bleed WebGL drive with a GTA-style HUD laid over it; one committed dusk-in-LA look. */
:root{
  --ink:#0e0b16; --glass:rgba(14,11,22,.78); --paper:#f7efe4; --muted:#bfb2cc;
  --sun:#ffb347; --pink:#ff5d8f; --cash:#79d27c; --sign:#0b6b3a;
  --display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --hud:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:var(--hud);font-size:17px;overflow-x:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#road{height:1800vh;position:relative;z-index:-1}
.hud{position:fixed;z-index:5;pointer-events:none}
.stroke{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 6px rgba(0,0,0,.6)}

/* top left: place */
#place{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
#place .where{font-family:var(--display);font-size:clamp(22px,3vw,34px);letter-spacing:.02em;color:var(--paper);text-transform:uppercase;line-height:1}
#place .chap{font-weight:700;font-size:14px;letter-spacing:.16em;color:var(--sun);text-transform:uppercase;margin-top:4px}

/* top right: clock, uptime, on-call stars */
#stats{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));text-align:right;display:grid;gap:2px}
#clock{font-family:var(--display);font-size:clamp(22px,3vw,32px);line-height:1}
#uptime{font-family:var(--display);font-size:clamp(18px,2.4vw,26px);color:var(--cash);line-height:1.1;font-variant-numeric:tabular-nums}
#stars{font-size:20px;letter-spacing:2px;color:var(--paper)}
#stars small{display:block;font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--muted)}

/* minimap */
#mapwrap{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:190px;height:190px;border-radius:50%;overflow:hidden;border:3px solid rgba(0,0,0,.85);box-shadow:0 0 0 2px rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.5);background:#1d1a26}
#minimap{width:100%;height:100%;display:block}

/* subtitles */
#subs{left:50%;transform:translateX(-50%);bottom:calc(30px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 32px));text-align:center;font-size:clamp(19px,2.2vw,25px);font-weight:600;line-height:1.25;opacity:0;transition:opacity .35s}
#subs.on{opacity:1}
#subs b{color:var(--sun);font-weight:700}

/* chapter banner */
#banner{top:30%;left:0;right:0;text-align:center;opacity:0;transition:opacity .5s,transform .5s;transform:scale(.96)}
#banner.on{opacity:1;transform:none}
#banner .n{font-weight:700;letter-spacing:.3em;font-size:15px;color:var(--paper)}
#banner .t{font-family:var(--display);font-size:clamp(40px,7vw,84px);color:var(--sun);line-height:1;text-transform:uppercase}
#banner.passed .t{color:var(--sun)}
#banner .r{font-family:var(--display);font-size:clamp(22px,3vw,34px);color:var(--paper)}

/* intro title */
#intro{left:0;right:0;top:20%;text-align:center;transition:opacity .9s;padding-inline:16px}
#intro.off{opacity:0}
#intro .name{font-family:var(--display);font-size:clamp(54px,11vw,150px);line-height:.9;letter-spacing:.01em;color:var(--paper);text-transform:uppercase}
#intro .role{font-family:var(--display);font-size:clamp(20px,3.4vw,40px);color:var(--pink);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}
#intro .tag.snd{font-size:clamp(12px,1.4vw,14px);color:var(--sun);margin-top:14px}
#intro .tag{font-weight:600;font-size:clamp(15px,1.8vw,19px);letter-spacing:.2em;text-transform:uppercase;margin-top:10px;color:var(--paper)}

/* scroll hint */
#hint{left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:15px;opacity:0;transition:opacity .5s}
#hint.on{opacity:1}
#hint .mouse{width:22px;height:34px;border:2px solid var(--paper);border-radius:12px;position:relative;box-shadow:0 0 0 2px #000}
#hint .mouse::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;background:var(--sun);border-radius:2px;animation:wheel 1.4s infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(10px);opacity:0}}

/* story card */
#card{top:calc(92px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:min(390px,calc(100% - 32px));background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.1);padding:16px 18px 18px;opacity:0;transform:translateX(-14px);transition:opacity .4s,transform .4s;pointer-events:none;max-height:calc(100% - 330px);overflow:auto}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .k{font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun)}
#card h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.02;margin:6px 0 4px;text-transform:uppercase;text-wrap:balance}
#card .sub{color:var(--pink);font-weight:700;font-size:18px;letter-spacing:.04em}
#card p{font-family:var(--hud);font-size:17px;line-height:1.35;color:var(--paper);margin:10px 0 0}
#card ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}
#card li{display:grid;grid-template-columns:18px 1fr;gap:8px;line-height:1.3}
#card li::before{content:"";width:12px;height:12px;margin-top:4px;border:2px solid var(--cash);background:linear-gradient(var(--cash),var(--cash)) center/6px 6px no-repeat}
#card li.todo::before{border-color:var(--muted);background:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:12px;font-size:16px}
.facts dt{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:13px;font-weight:700;padding-top:2px}
.facts dd{margin:0;font-weight:600}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;gap:3px;transition:opacity .3s}
.bar .lab{display:flex;justify-content:space-between;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px}
.bar .lab span:last-child{color:var(--muted);font-weight:600;letter-spacing:0;text-transform:none}
.bar .track{height:9px;background:rgba(255,255,255,.12);border:1px solid #000}
.bar .fill{height:100%;background:var(--paper)}
.bar.hot .fill{background:var(--sun)}
.bar.hot .lab span:first-child{color:var(--sun)}
.ph{color:var(--sun);font-style:normal}
.contact{display:grid;gap:8px;margin-top:12px}
.contact .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:rgba(255,255,255,.06);padding:8px 10px}
.contact .row .what{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted);width:64px}
.contact .row .val{font-weight:600;font-size:17px;user-select:all;overflow-wrap:anywhere;min-width:0}
.contact a{color:var(--paper)}
button,.btn{font-family:var(--hud);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--ink);background:var(--paper);border:0;padding:9px 13px;cursor:pointer}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.ghost{background:rgba(14,11,22,.75);color:var(--paper);border:1px solid rgba(255,255,255,.3)}
button.small{padding:5px 8px;font-size:12px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* controls */
#controls{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto}
#controls .keys{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* loading */
#loading{position:fixed;inset:0;z-index:20;background:var(--ink);display:grid;place-items:center;transition:opacity .8s}
#loading.off{opacity:0;pointer-events:none}
#loading div{font-family:var(--display);font-size:32px;letter-spacing:.06em;color:var(--sun);text-transform:uppercase}
#loading small{display:block;font-family:var(--hud);font-size:15px;letter-spacing:.2em;color:var(--muted);margin-top:6px;text-align:center}

/* full CV */
#cv{position:fixed;inset:0;z-index:30;background:rgba(10,8,16,.94);overflow:auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#cv .sheet{max-width:760px;margin:0 auto;background:var(--paper);color:#1c1724;padding:clamp(20px,5vw,48px);font-family:var(--hud);font-size:18px;line-height:1.4}
#cv .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
#cv h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,7vw,64px);line-height:.95;margin:0;text-transform:uppercase}
#cv .role{font-weight:700;color:#b02a5b;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
#cv h3{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:28px 0 8px;border-bottom:2px solid #1c1724;padding-bottom:4px}
#cv .job{margin-top:14px}
#cv .job .h{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-weight:700}
#cv .job .h span:last-child{color:#5d5367;font-weight:600;font-variant-numeric:tabular-nums}
#cv ul{margin:6px 0 0;padding-left:20px}
#cv .chips{display:flex;flex-wrap:wrap;gap:6px}
#cv .chips span{border:1.5px solid #1c1724;padding:2px 9px;font-weight:600}
#cv .ph{color:#a4560a}
#cv button{background:#1c1724;color:var(--paper)}

@media (max-width:700px){
  #mapwrap{width:112px;height:112px}
  #card{top:calc(78px + env(safe-area-inset-top,0px));max-height:calc(100% - 290px);padding:12px 14px}
  #card h2{font-size:27px}
  #card p,.facts{font-size:15px}
  #controls .keys{display:none}
  #uptime,#stars{display:none}
  #place .chap{font-size:12px}
  #hint span:last-child{white-space:nowrap}
  #subs{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  #hint{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
  #banner{top:40%}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style>
</head>
<body>

<canvas id="scene" aria-label="First-person drive through Los Angeles"></canvas>
<div id="road"></div>

<div id="loading"><div>Starting the engine<small>Warming up LA</small></div></div>

<div id="place" class="hud stroke"><div class="where" id="where">Harbor Freeway</div><div class="chap" id="chap">Chapter 1 · The Pickup</div></div>
<div id="stats" class="hud stroke"><div id="clock">6:12 PM</div><div id="uptime">UPTIME 99.99%</div><div id="stars">★★★★☆<small>On-call level</small></div></div>
<div id="mapwrap" class="hud"><canvas id="minimap" width="380" height="380"></canvas></div>
<div id="intro" class="hud stroke"><div class="name" id="introName">Quinn</div><div class="role" id="introRole">Systems Administrator</div><div class="tag">A drive through Los Angeles</div><div class="tag snd">Click or tap anywhere for engine and radio</div></div>
<div id="banner" class="hud stroke"><div class="n" id="bannerN">Chapter 2</div><div class="t" id="bannerT">Player Profile</div><div class="r" id="bannerR"></div></div>
<div id="subs" class="hud stroke" aria-live="polite"></div>
<div id="hint" class="hud stroke"><span class="mouse"></span><span>Scroll to drive</span></div>
<aside id="card" class="hud" aria-live="polite"></aside>
<div id="controls" class="hud">
  <span class="keys stroke">Drag to look · hold R to look right</span>
  <button id="lookBtn" class="ghost">Look at Dani</button>
  <button id="soundBtn" class="ghost" aria-pressed="false">Sound: off</button>
  <button id="cvBtn">Read the full CV</button>
</div>
<section id="cv" hidden aria-label="Quinn's CV"></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
/* =====================================================================
   EDIT ME: everything Quinn-specific lives in this object.
   Anything in [square brackets] is a placeholder waiting for real details.
   ===================================================================== */
const CV = {
  name: "Quinn",
  surname: "Willett",
  title: "Senior Systems Administrator",
  tagline: "Microsoft 365, identity and infrastructure",
  location: "Staines-upon-Thames, UK",
  years: "8",
  dreamCar: "Range Rover Sport SVR",
  drives: "2019 MG ZS EV",
  friend: "Dani",
  summary: "Eight years looking after IT end to end at Emanuel School, from Entra ID and Exchange Online through to servers, firewalls and fibre. I'm the person the team escalates to, I work with the Head of IT to scope and test changes before they go live, and I've contributed to a tender from technical specification to supplier evaluation. Next, I want to focus that breadth on Microsoft 365, improving the identity, email and collaboration services people rely on every day.",
  // bar lengths are just for the game-style stats screen
  skills: [
    { name: "Microsoft 365", level: .95, detail: "Entra ID · Exchange Online · MFA" },
    { name: "Endpoint", level: .9, detail: "Intune · Autopilot · AppLocker" },
    { name: "Server", level: .9, detail: "Windows Server 2025 · AD · Hyper-V" },
    { name: "Network", level: .85, detail: "FortiGate · Ruckus · VLANs" },
    { name: "Security", level: .82, detail: "ESET · iboss · firewall rules" },
    { name: "Service", level: .88, detail: "Freshservice · tendering · docs" }
  ],
  jobs: [
    { years: "Jul 2018 – Now", role: "Senior Systems Administrator", company: "Emanuel School", sign: "M365 + identity",
      wins: ["Owns the Microsoft 365 and Azure tenant, including Entra ID and hybrid identity with on-prem AD", "Configures MFA, trusted locations and authentication policies, and manages licensing", "Runs Exchange Online mail flow and retention, plus OneDrive policies that protect staff and pupil data", "Manages Windows devices in Intune: Autopilot, Windows Hello for Business, AppLocker and app packaging"] },
    { years: "Jul 2018 – Now", role: "Infrastructure & projects", company: "Emanuel School", sign: "Infrastructure", continues: true,
      wins: ["Runs Windows Server 2025: AD, DNS, DHCP failover, Group Policy and Hyper-V", "Manages FortiGate firewalls, Ruckus wireless, ICX switching, VLANs and RADIUS", "Third line escalation point in Freshservice, and scopes and tests changes with the Head of IT", "Wrote technical sections of an Invitation to Tender and helped evaluate supplier responses"] },
    { years: "Sep 2016 – Jun 2018", role: "Partnership Administrator Apprentice", company: "Brooklands College", sign: "Apprentice",
      wins: ["Completed an NVQ Level 3 in Business Administration alongside the role", "Maintained CRM records and published content online"] }
  ],
  supports: ["Windows", "macOS", "ChromeOS", "iOS", "Android"],
  education: "NVQ Level 3, Business Administration · Brooklands College, 2016 to 2018",
  contact: [
    { what: "Email", value: "quinn@quinnwillett.com" },
    { what: "LinkedIn", value: "linkedin.com/in/quinnwillett", url: "https://www.linkedin.com/in/quinnwillett" }
  ]
};

/* Billboards on Sunset: one per skill, same order as CV.skills */
const ADS = [
  { head: "YOUR TENANT, HANDLED.", sub: "ENTRA ID · HYBRID IDENTITY · EXCHANGE ONLINE · MFA", a: "#ff5d8f", b: "#ffb347", ink: "#1b0f1f" },
  { head: "autopilot: engaged", sub: "INTUNE · AUTOPILOT · WINDOWS HELLO · APPLOCKER", a: "#121a33", b: "#2f4f86", ink: "#ffe7b0", mono: true },
  { head: "IT'S ALWAYS DNS.", sub: "WINDOWS SERVER 2025 · AD · DHCP FAILOVER · HYPER-V", a: "#f2e8d5", b: "#e9c98f", ink: "#1b2a4a" },
  { head: "VLAN THERE, DONE THAT.", sub: "FORTIGATE · RUCKUS · ICX · VLANS · RADIUS", a: "#3fd0c9", b: "#1f6f8b", ink: "#ffffff" },
  { head: "MFA OR BUST.", sub: "ESET · IBOSS CLOUD · FIREWALL RULES", a: "#1b1b1b", b: "#3a2a12", ink: "#ffb347" },
  { head: "THIRD LINE. LAST LINE.", sub: "FRESHSERVICE · TENDERING · DOCUMENTATION", a: "#7c3aed", b: "#ff5d8f", ink: "#ffffff" }
];

const isPh = s => /\[.*\]/.test(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ph = s => isPh(s) ? `<em class="ph">${esc(s)}</em>` : esc(s);
const fullName = () => `${CV.name} ${CV.surname}`;

/* ------------------------------ story timing (progress 0..1 along the route) ------------------------------ */
const CHAPTERS = [
  { p: 0, n: 1, title: "The Pickup", where: "Harbor Freeway" },
  { p: .085, n: 2, title: "Player Profile", where: "Downtown LA" },
  { p: .18, n: 3, title: "The Strip", where: "Sunset Boulevard" },
  { p: .455, n: 4, title: "The Missions", where: "Hollywood Freeway" },
  { p: .74, n: 5, title: "Collectibles", where: "Pacific Coast Hwy" },
  { p: .915, n: 6, title: "The Drive-Thru", where: "Byte Burger, Santa Monica" }
];
const LINES = [
  [.003, .018, "Windows down, music up. Go on then, show me your LA."],
  [.018, .034, "One road, a few stops, then burgers. Your CV, my commentary."],
  [.085, .113, "Downtown. This is where your career got serious."],
  [.18, .212, "Sunset Strip. Every billboard here is about you. I didn't pay for them. Probably."],
  [.3, .334, "\"It's always DNS.\" You run the DNS, so it's never DNS. Allegedly."],
  [.455, .492, "The 101. Every exit sign up here is a chapter of your career."],
  [.615, .655, "Third line escalation. When the team's stuck, they call you."],
  [.735, .785, "PCH. Ocean's on my side, so I win."],
  [.865, .9, "Windows, Mac, ChromeOS, iOS, Android. You support the lot."],
  [.912, .95, "Byte Burger. Best fries in LA. Their Wi-Fi could use you."],
  [.975, 1.01, "Two Uptime Combos, extra fries. And someone hire this man."]
];
const BILLBOARD_P = [.205, .245, .285, .325, .365, .405];
const JOB_STOP = [[.505, .52], [.585, .6], [.665, .68]];
const CERT_P = [.804, .816, .828, .84, .852];
/* scroll fraction -> route progress. Flat stretches are the stops. */
const KEYS = [[0, .05], [.07, .13], [.12, .15], [.16, .2], [.4, .44], [.45, .505], [.49, .52], [.53, .585], [.57, .6], [.61, .665], [.65, .68], [.71, .8], [.79, .865], [.86, .955], [.93, 1], [1, 1]];
function scrollToProgress(u) {
  for (let i = 1; i < KEYS.length; i++) if (u <= KEYS[i][0]) {
    const [u0, p0] = KEYS[i - 1], [u1, p1] = KEYS[i];
    return p0 + (p1 - p0) * ((u - u0) / Math.max(1e-6, u1 - u0));
  }
  return 1;
}

/* ------------------------------ helpers ------------------------------ */
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.userData = { c, g, draw };
  return t;
}
function fitText(g, text, font, maxW, start) {
  let s = start; do { g.font = font.replace("#", s); s -= 2; } while (g.measureText(text).width > maxW && s > 10); return s + 2;
}
function wrapLines(g, text, maxW) {
  const words = text.split(" "), out = []; let line = "";
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
  if (line) out.push(line); return out;
}

(async function main() {
  /* photo textures (Adobe Stock) and the two rigged characters load alongside the fonts */
  const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; setTimeout(() => res(null), 20000); });
  const loadGLB = src => new Promise(res => { if (!THREE.GLTFLoader) return res(null); new THREE.GLTFLoader().load(src, res, undefined, () => res(null)); setTimeout(() => res(null), 30000); });
  const TEX_NAMES = ["asphalt", "paving", "grass", "sand", "facade_warm", "facade_grid", "facade_glass"];
  const assetsP = Promise.all([Promise.all(TEX_NAMES.map(n => loadImg("tex/" + n + ".jpg"))), Promise.all(["models/dani.json", "models/driver.json"].map(loadGLB))]);
  try {
    await Promise.race([Promise.all([
      document.fonts.load("64px Anton"), document.fonts.load('700 40px "Barlow Condensed"'),
      document.fonts.load('600 40px "Barlow Condensed"'), document.fonts.load("800 40px Overpass")
